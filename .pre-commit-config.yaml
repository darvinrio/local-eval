repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      # Ruff version.
      rev: v0.15.12
      hooks:
          # Run the linter.
          - id: ruff-check
            args: [--fix]
          # Run the formatter.
          - id: ruff-format
    - repo: local
      hooks:
          - id: ty
            name: ty check
            entry: uvx ty check . --ignore unresolved-import
            language: python
